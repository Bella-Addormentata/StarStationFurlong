name: "✅ PR Checks"

# PR-time compile gate — the checks we previously only ran by hand (or that the
# release workflow only ran at tag time). Six lanes:
#   1. Frontend `tsc --noEmit` — the repo's long-standing "tsc clean" bar.
#   2. Frontend `npm test` (vitest) — treasury contract unit tests + the shared
#      TS<->Rust golden vectors under test-vectors/treasury/.
#   3. `cargo check` + `cargo test` on the sovereign node with DEFAULT features —
#      what a local `cargo check` compiles. Since #231 D3 the default build carries
#      the chain READ side (`chia-read`: chia_rooms / chia_resolve / chia_watch).
#   4. `cargo check`/`cargo test` with `--features chia-publish` — the publish-only
#      modules (chia_wallet / chia_publish / chia_craps_fair / treasury_codec) are
#      INVISIBLE to a default check, so a PR could break them without anyone
#      noticing until the tag-time release build (#87's near-miss: a review fix to
#      the gated module shipped without ever having been compiled).
#   5. `cargo test --features chia-publish,torrent` — the release build's feature
#      set, with the TV's torrent lane (torrent_lane.rs + the forked librqbit
#      crates under vendor/) — and a Windows `cargo check` of the same, since the
#      torrent feature brings C code (aws-lc-sys) that only the release would
#      otherwise compile on Windows.
#   6. 🏦 The SSF wallet's own tests (`chia_wallet*`) on Windows and macOS, and a
#      macOS `cargo check` of the release set: the wallet's identity file is
#      written with hard links, directory syncs and owner-only modes that differ
#      per OS, and its at-rest protection (DPAPI on Windows, the keychain on
#      macOS, #335 stage 1) is OS code no Linux run compiles. Without these a
#      macOS path would first compile in the tag-time release.

on:
  pull_request:
  workflow_dispatch:

env:
  # Mirror of release.yml's RELEASE_FRONTEND — the prototype the app ships.
  RELEASE_FRONTEND: prototypes/0.29.0-core-loop-demo

jobs:
  frontend-typecheck:
    name: 🟦 Frontend tsc --noEmit
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ env.RELEASE_FRONTEND }}/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: ${{ env.RELEASE_FRONTEND }}

      - name: 🔎 tsc --noEmit
        run: npx tsc --noEmit
        working-directory: ${{ env.RELEASE_FRONTEND }}

      # Treasury PR B golden vectors: the same fixtures are asserted by
      # `cargo test --features chia-publish` (treasury_codec.rs), so a drift in
      # either runtime's canonical encoding fails one lane or the other.
      - name: 🧪 npm test (vitest)
        run: npm test
        working-directory: ${{ env.RELEASE_FRONTEND }}

  node-check:
    name: 🦀 Node cargo check + test (default, chia-publish, torrent)
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '${{ env.RELEASE_FRONTEND }}/ssf-p2p-node -> target'
          # The default key ignores the image version — a cache built on another
          # ubuntu image restores as a broken target dir (E0463 "can't find
          # crate"), so scope it to the pinned runner.
          key: ubuntu-22.04

      - name: 🔎 cargo check (default features = chia-read)
        run: cargo check --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

      - name: 🧪 cargo test (default features = chia-read)
        run: cargo test --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

      - name: 🔎 cargo check --features chia-publish
        run: cargo check --features chia-publish --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

      - name: 🧪 cargo test --features chia-publish
        run: cargo test --features chia-publish --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

      - name: 🧪 cargo test --features chia-publish,torrent (the release set)
        run: cargo test --features chia-publish,torrent --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

  node-check-windows:
    name: 🦀 Node cargo check on Windows (release features)
    runs-on: windows-latest # MSVC, as the release builds
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '${{ env.RELEASE_FRONTEND }}/ssf-p2p-node -> target'

      - name: 🔎 cargo check --features chia-publish,torrent
        shell: bash
        run: cargo check --features chia-publish,torrent --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

      # 🏦 The SSF wallet's tests on NTFS and the Windows API (the filter
      # matches chia_wallet:: and chia_wallet_switch::).
      - name: 🧪 cargo test --features chia-publish,torrent chia_wallet
        shell: bash
        run: cargo test --features chia-publish,torrent --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml chia_wallet

  node-check-macos:
    name: 🦀 Node cargo check + wallet tests on macOS (release features)
    runs-on: macos-latest # Apple Silicon, as the release's .dmg
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '${{ env.RELEASE_FRONTEND }}/ssf-p2p-node -> target'

      - name: 🔎 cargo check --features chia-publish,torrent --tests
        run: cargo check --features chia-publish,torrent --tests --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml

      # 🏦 The SSF wallet's tests on APFS and the macOS API.
      - name: 🧪 cargo test --features chia-publish,torrent chia_wallet
        run: cargo test --features chia-publish,torrent --manifest-path ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node/Cargo.toml chia_wallet
