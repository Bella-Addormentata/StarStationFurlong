name: "🚀 Publish Sovereign Releases"

on:
  push:
    # Trigger when tags matching vX.Y.Z are pushed (supporting multi-digit places, e.g. v10.20.30)
    # (e.g., v0.1.0, v1.12.3, v10.20.30)
    # Uses standard GitHub Action glob filter syntax: [0-9]* matches any number of digits starting with a digit.
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # Manual path — the SAME pipeline, started from the Actions tab or with
  #   gh workflow run release.yml -f tag=vX.Y.Z -f target=<commit sha>
  # for when a tag push is not possible from where the release was prepared
  # (v0.35.0: branch pushes worked from that environment, refs/tags pushes
  # 403'd four times, and the tag had to be pushed from another machine).
  # The tag is resolved ONCE in create-release — reused untouched if it exists,
  # otherwise created there, but only after the release guard has passed on
  # the tree it will name — and every later job checks out that tag's COMMIT,
  # never the ref this run was dispatched from. So dispatch from `main` (the
  # trigger has to live on the default branch to be offered): the workflow
  # definition comes from main, the release tree from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, vX.Y.Z. Created at `target` if it does not exist yet; reused as it stands if it does.'
        required: true
        type: string
      target:
        description: 'Commit to tag — SHA, branch or tag name. Blank = the head of the ref selected above. Ignored when the tag already exists: a tag is never moved.'
        required: false
        type: string
        default: ''

# One release run at a time. The draft lifecycle is single-writer: create-release
# sweeps stale drafts for the tag, so a second run for the same tag starting while
# the first is still uploading would delete the live draft from under it, and two
# runs could race to create duplicate drafts. Queue, never cancel — cancelling a
# half-uploaded run is the worse failure. Releases are rare enough that a single
# global lane costs nothing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # 🎯 WHICH PROTOTYPE THE RELEASE SHIPS AS THE APP FRONTEND.
  # The Tauri PROJECT is built from this same folder — `projectPath` below is
  # RELEASE_FRONTEND — so the shell (window, Rust node, icons, app version)
  # comes from <this folder>/src-tauri, not from a fixed path.
  # To release a different demo:
  #   1. Point this at the demo folder (e.g. prototypes/0.0.4-navigation-demo).
  #   2. Make sure that folder has a committed package-lock.json and a
  #      `npm run build` script that outputs to its local dist/.
  #   3. Commit, then push a vX.Y.Z tag as usual (or dispatch this workflow
  #      with `tag` + `target` — see workflow_dispatch above).
  RELEASE_FRONTEND: prototypes/0.29.0-core-loop-demo

jobs:
  # ── Stage 1: create ONE shared draft release ─────────────────────────────
  # tauri-action cannot reliably find draft releases by tag (drafts are not
  # addressable via get-release-by-tag), so letting each matrix job create or
  # find the draft races and scatters the installers across duplicate drafts.
  # Instead we create the draft exactly once here and hand its id to every
  # platform job.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      # The tag this run releases and the COMMIT it names — resolved once, here,
      # so every build job checks out the same tree however the run was started.
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      # Resolve WHICH tag this run releases and WHICH commit that is, before
      # anything is checked out — and write NOTHING yet. Tag push: both come
      # from the event. Manual dispatch: the tag is an input — an existing tag
      # is reused as it stands (never moved; `target` is ignored with a
      # warning); a missing one is resolved to the commit it will name, and the
      # create-tag step below writes it only after the release guard has passed
      # on that commit's tree. Both paths are held to the vX.Y.Z format: the
      # push trigger's glob is looser than that (its `*` admits `v1.2.3-rc1`).
      # Either way a tag whose release is already PUBLISHED fails here with the
      # reason rather than at createRelease: releases in this repo are immutable.
      - name: 🏷️ Resolve release tag and commit
        id: tag
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const TAG_RE = /^v\d+\.\d+\.\d+$/;
            const isPush = context.eventName === 'push';

            // Follow refs/tags/<tag> down to the COMMIT it names: an annotated
            // tag's ref points at a tag object, a lightweight tag's at the commit.
            async function peel(ref) {
              let { type, sha } = ref.object;
              while (type === 'tag') {
                const { data: t } = await github.rest.git.getTag({ owner, repo, tag_sha: sha });
                ({ type, sha } = t.object);
              }
              return sha;
            }
            // "Not there" → null; anything else is a real error and must surface.
            async function maybe(call, absent = [404]) {
              try { return (await call()).data; }
              catch (e) { if (absent.includes(e.status)) return null; throw e; }
            }

            const tag = isPush ? context.ref.replace('refs/tags/', '') : (process.env.INPUT_TAG || '').trim();
            if (!TAG_RE.test(tag)) {
              core.setFailed(`tag must look like vX.Y.Z, got '${tag}'`
                + (isPush ? ' — the trigger glob is looser than the release format; delete this tag and push a vX.Y.Z one' : ''));
              return;
            }

            let sha, create = false;
            if (isPush) {
              sha = context.sha;
            } else {
              const target = (process.env.INPUT_TARGET || '').trim();
              const existing = await maybe(() => github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` }));
              if (existing) {
                sha = await peel(existing);
                if (target) core.warning(`Tag ${tag} already exists at ${sha}; ignoring target '${target}' — this workflow never moves a tag.`);
                core.info(`Reusing existing tag ${tag} -> ${sha}`);
              } else {
                // Resolve `target` (SHA, branch or tag name) to a full commit SHA
                // first, so a typo fails here instead of tagging the wrong thing.
                // The commits endpoint answers 422 for an unknown SHA, 404 otherwise.
                const want = target || context.sha;
                const commit = await maybe(() => github.rest.repos.getCommit({ owner, repo, ref: want }), [404, 422]);
                if (!commit) {
                  core.setFailed(`target '${want}' does not resolve to a commit in ${owner}/${repo}`);
                  return;
                }
                sha = commit.sha;
                create = true; // written by the create-tag step, after the guard
                core.info(`Tag ${tag} does not exist yet; it will be created at ${sha} once the release guard passes`);
              }
            }

            // get-release-by-tag only ever returns PUBLISHED releases (drafts are
            // not addressable by tag), so any hit means this version is frozen.
            const published = await maybe(() => github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            if (published) {
              core.setFailed(`Release ${tag} is already published and immutable: ${published.html_url}. Bump the version and cut a new tag.`);
              return;
            }

            core.info(`Releasing ${tag} at ${sha}`);
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
            core.setOutput('create', String(create));

      - name: 📥 Checkout repository (the release commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.sha }}

      # The two things README § "Cutting a release" says this workflow used to
      # get SILENTLY wrong, checked on the tagged tree before anything is
      # written — no tag on the dispatch path, no draft on either:
      #   1. CHANGELOG.md's first `## v...` heading is this tag's; otherwise the
      #      notes step below would ship the PREVIOUS version's section.
      #   2. All NINE version locations agree with the tag — the list kept in
      #      src/version.ts; the two Cargo.lock entries are what a grep misses.
      # Inline rather than a script file on purpose: the workflow definition is
      # what runs (from main on a dispatch) while the checked-out tree is the
      # tag's, and a tag older than a script file would have nothing to run.
      - name: 🔎 Release guard — CHANGELOG section + nine version locations
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -u
          ver="${RELEASE_TAG#v}"
          fail=0
          bad() { echo "::error::$*"; fail=1; }
          ok()  { echo "ok   $*"; }

          # 1. CHANGELOG — the same key the notes extraction uses: the first line starting `## v`.
          first="$(grep -m1 '^## v' CHANGELOG.md || true)"
          if printf '%s\n' "$first" | grep -qE "^## ${RELEASE_TAG//./\\.}( |$)"; then
            ok "CHANGELOG.md first version section: $first"
          else
            bad "CHANGELOG.md: first version section is '${first:-<none>}', expected '## $RELEASE_TAG — <date>'. Rename '## Unreleased' before tagging (README § Cutting a release) — as it stands the release would ship the previous version's notes."
          fi

          # 2. The nine version locations, all under RELEASE_FRONTEND.
          cd "$RELEASE_FRONTEND"
          json_version() { node -p "require('./$1').version ?? ''" 2>/dev/null || true; }
          # First `key = "..."` inside the [package] table of a Cargo.toml.
          toml_pkg() { awk -F'"' -v key="$2" '/^\[package\]/{p=1;next} /^\[/{p=0} p && $0 ~ "^" key " *=" {print $2; exit}' "$1" 2>/dev/null || true; }
          # `version` of the [[package]] block named $2 in a Cargo.lock.
          lock_pkg() { awk -F'"' -v name="$2" '$0 == "name = \"" name "\"" {f=1; next} f && /^version = / {print $2; exit}' "$1" 2>/dev/null || true; }
          check() {
            local what="$1" got="$2"
            if [ "$got" = "$ver" ]; then ok "$what = $got"; else bad "$what reads '${got:-<missing>}', tag says '$ver'"; fi
          }
          check "package.json .version"                     "$(json_version package.json)"
          check "package-lock.json .version"                "$(json_version package-lock.json)"
          check "package-lock.json .packages[\"\"].version" "$(node -p "require('./package-lock.json').packages['']?.version ?? ''" 2>/dev/null || true)"
          check "src-tauri/tauri.conf.json .version"        "$(json_version src-tauri/tauri.conf.json)"
          check "src/version.ts APP_VERSION"                "$(sed -nE "s/^export const APP_VERSION = '([^']*)';.*/\1/p" src/version.ts 2>/dev/null || true)"
          for crate in src-tauri ssf-p2p-node; do
            name="$(toml_pkg "$crate/Cargo.toml" name)"
            check "$crate/Cargo.toml [package] version"            "$(toml_pkg "$crate/Cargo.toml" version)"
            check "$crate/Cargo.lock entry for ${name:-<no name>}" "$(lock_pkg "$crate/Cargo.lock" "$name")"
          done

          if [ "$fail" != 0 ]; then
            echo "::error::$RELEASE_TAG is not release-ready. Nothing was created — fix the tree, then tag (or dispatch) again."
            exit 1
          fi
          echo "✅ $RELEASE_TAG is release-ready: CHANGELOG section present, nine version locations agree."

      # Only now — the tree checked — does a dispatch write anything: the
      # annotated tag at the resolved commit, the same shape as a hand-made one.
      # A tag created with GITHUB_TOKEN does NOT fire the `push` trigger above
      # (GitHub never starts a workflow off an event made with GITHUB_TOKEN),
      # so there is no second run. A tag push already has its tag: skipped.
      - name: 🏷️ Create the tag (manual dispatch of a new tag only)
        if: steps.tag.outputs.create == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG, sha = process.env.RELEASE_SHA;
            const { data: tagObj } = await github.rest.git.createTag({
              owner, repo, tag, object: sha, type: 'commit',
              message: `StarStation Furlong ${tag}`,
            });
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: tagObj.sha });
            core.info(`Created annotated tag ${tag} -> ${sha}`);

      # Extract this release's notes (top version section of CHANGELOG.md) for the release body.
      # Matches the first `## v...` heading so the `## Unreleased` stub is skipped
      # (pre-v0.16.0 releases shipped the Unreleased stub as their body by mistake).
      - name: 📝 Extract release notes from CHANGELOG.md
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          awk '/^## v/{n++; next} n==1{print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Sovereign P2P Space MMO - Production build stable release ${RELEASE_TAG}. See CHANGELOG.md." > RELEASE_NOTES.md
          fi

      - name: 🎫 Create shared draft release
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8');

            // Clean up stale DRAFT releases for this tag left by earlier
            // partial/failed runs. Published releases are never touched.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const r of releases.filter((r) => r.draft && r.tag_name === tag)) {
              core.info(`Deleting stale draft release ${r.id} (${r.name})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: r.id,
              });
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `StarStation Furlong ${tag}`,
              body,
              draft: true, // published by finalize-release ONLY after every artifact is attached
              prerelease: false,
            });
            core.info(`Created draft release ${data.id}: ${data.html_url}`);
            return data.id;

  # ── Stage 2: build every platform and upload into the shared draft ───────
  publish-tauri-binaries:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon & Intel macOS Universal
            args: ''
          - platform: 'ubuntu-22.04' # Ubuntu Debian & AppImage
            args: ''
          - platform: 'windows-latest' # Windows MSI and NSIS installers
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout repository (the release commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}

      # 1. Setup Node.js runtimes for Vite/Three.js frontend compilations
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '${{ env.RELEASE_FRONTEND }}/package-lock.json'

      # 2. Setup stable Rust toolchains for our sovereign backbones
      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust cache to drastically improve consecutive build durations
      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.RELEASE_FRONTEND }}/src-tauri -> target
            ${{ env.RELEASE_FRONTEND }}/ssf-p2p-node -> target

      # 3. Install platform-specific compiler dependencies (Webkit/GTK libraries for Linux)
      - name: 🔧 Install System Dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 4. Install dependencies and build the SELECTED frontend (env.RELEASE_FRONTEND)
      - name: 📦 Install & Build Frontend (${{ env.RELEASE_FRONTEND }})
        shell: bash
        run: |
          cd "$RELEASE_FRONTEND"
          npm ci
          npm run build

      # 4b. Build the sovereign P2P node for THIS platform and stage it where
      #     the Tauri bundler expects external binaries (bundle.externalBin):
      #     src-tauri/binaries/ssf-p2p-node-<host-triple>[.exe]. The installer
      #     then places it next to the app executable, where the app's spawn
      #     probe already looks first — no separate download needed.
      #     ⛔ macOS: skipped — the v0.20.0 run showed the mac bundler failing
      #     with externalBin while Windows/Linux built clean; mac keeps the
      #     standalone-node flow until that failure is reproduced with logs.
      - name: 🛰️ Build & stage bundled P2P node sidecar
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: |
          cargo build --release --manifest-path "$RELEASE_FRONTEND/ssf-p2p-node/Cargo.toml"
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p "$RELEASE_FRONTEND/src-tauri/binaries"
          if [ -f "$RELEASE_FRONTEND/ssf-p2p-node/target/release/ssf-p2p-node.exe" ]; then
            cp "$RELEASE_FRONTEND/ssf-p2p-node/target/release/ssf-p2p-node.exe" \
               "$RELEASE_FRONTEND/src-tauri/binaries/ssf-p2p-node-$triple.exe"
          else
            cp "$RELEASE_FRONTEND/ssf-p2p-node/target/release/ssf-p2p-node" \
               "$RELEASE_FRONTEND/src-tauri/binaries/ssf-p2p-node-$triple"
          fi
          ls -la "$RELEASE_FRONTEND/src-tauri/binaries"

      # 5. Point the shared Tauri shell at the selected frontend's dist/.
      #    Written as a JSON overlay merged into tauri.conf.json via `--config`;
      #    the before-build hook becomes a no-op because step 4 already built it.
      #    On macOS the overlay also strips bundle.externalBin (see step 4b note).
      - name: 🔀 Select release frontend for Tauri shell
        shell: bash
        run: |
          name="${RELEASE_FRONTEND##*/}"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            extra=', "bundle": { "externalBin": [] }'
          else
            extra=''
          fi
          cat > "$RELEASE_FRONTEND/release-frontend.json" <<EOF
          {
            "build": {
              "beforeBuildCommand": "echo frontend prebuilt by workflow",
              "frontendDist": "../../${name}/dist"
            }${extra}
          }
          EOF
          echo "Tauri config overlay:" && cat "$RELEASE_FRONTEND/release-frontend.json"

      # 6. Run Rust Cargo builds & upload installers into the shared draft release
      - name: 🛠️ Build & Package Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: ${{ env.RELEASE_FRONTEND }}
          args: --config release-frontend.json ${{ matrix.args }}

  # ── Stage 2b: build the sovereign P2P node and attach it to the same draft ─
  # The node is ALSO bundled inside every installer via bundle.externalBin
  # (staged in step 4b above), so fresh installs need no separate download.
  # This standalone asset remains for headless/always-on node operators
  # (reachable members, future beacons) and for patching older installs.
  # Independent job: if it fails, the installers above are unaffected.
  publish-p2p-node:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest # MSVC — the GNU dev-profile linker wall does not apply
    steps:
      - name: 📥 Checkout repository (the release commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '${{ env.RELEASE_FRONTEND }}/ssf-p2p-node -> target'

      - name: 🛰️ Build sovereign P2P node (release — default + chia-lane)
        shell: bash
        run: |
          NODE="$RELEASE_FRONTEND/ssf-p2p-node"
          # Default node — the one bundled in installers and the standalone asset.
          cargo build --release --manifest-path "$NODE/Cargo.toml"
          cp "$NODE/target/release/ssf-p2p-node.exe" ssf-p2p-node.exe
          # Experimental ChiaHub introduction lane (opt-in test build). CI is MSVC,
          # so the Windows-GNU iroh-relay cdylib export-ordinal wall does NOT apply
          # here and no special linker flag is needed (that flag is a local-GNU-only
          # workaround). Overwrites target/release/ssf-p2p-node.exe, so the default
          # copy above must already be staged.
          cargo build --release --features chia-lane --manifest-path "$NODE/Cargo.toml"
          cp "$NODE/target/release/ssf-p2p-node.exe" ssf-p2p-node-chia.exe
          ls -la ssf-p2p-node*.exe

      - name: ⬆️ Upload node binaries to the shared draft release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            // Default keeps the exact name the app's exe-adjacent spawn probe looks
            // for; the chia-lane build ships as a SEPARATE opt-in asset testers swap in.
            const assets = [
              { file: 'ssf-p2p-node.exe', name: 'ssf-p2p-node.exe' },
              { file: 'ssf-p2p-node-chia.exe', name: 'ssf-p2p-node-chia.exe' },
            ];
            for (const a of assets) {
              const data = fs.readFileSync(a.file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id,
                name: a.name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${a.name} (${data.length} bytes)`);
            }

  # ── Stage 3: publish the draft ONLY when every artifact is attached ──────
  # This repository has IMMUTABLE releases: publishing freezes the asset list
  # permanently, so publishing mid-run bricks the version (v0.20.0 was lost
  # exactly this way — published while builds were still uploading, leaving an
  # empty, undeletable release). Never publish the draft manually; this job
  # flips it once all installer jobs and the node asset are in. If anything
  # fails upstream, the draft stays a draft and the tag can be re-run safely —
  # re-run the failed run, or dispatch the workflow with the same `tag` (an
  # existing tag is reused, never moved; the stale draft is swept above).
  finalize-release:
    needs: [create-release, publish-tauri-binaries, publish-p2p-node]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: 🚀 Publish release (all artifacts green)
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            });
            // Sanity floor: 3 platform installer sets + standalone node exe.
            // Guards against publishing (immutably!) a half-populated release.
            if (rel.assets.length < 6) {
              core.setFailed(`Refusing to publish: only ${rel.assets.length} assets attached (expected >= 6). Draft left intact.`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false,
            });
            core.info(`Published release ${rel.tag_name} with ${rel.assets.length} assets.`);
