[package]
name = "ssf-p2p-node"
version = "0.40.0"
edition = "2021"
publish = false
description = "Sovereign P2P Swarm Node & WebTransport Router (Phase 2 P2P Backbone)"

[dependencies]
# Standard sovereign realtime stack (v006 Â§12.1 pins)
wtransport = { version = "0.6", features = ["quinn"] }
# Compile iroh with default-features = false to prevent linking a excessive number of exported DLL symbols on Windows GNU, avoiding E0432 / export ordinal overflows
# "portmapper" restores UPnP/NAT-PMP/PCP (reachability rung 1) that default-features = false silently dropped.
iroh = { version = "1", default-features = false, features = ["tls-ring", "portmapper"] }
# Sovereign zero-server discovery: publish/resolve node addresses via the BitTorrent Mainline DHT.
iroh-mainline-address-lookup = "0.4"
# Zero-hint same-LAN discovery (bare room key resolves on the local network, no internet needed).
iroh-mdns-address-lookup = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
yrs = { version = "0.27", features = ["sync"] }
blake3 = "1"
rand = "0.8"
# ChiaHub lane (REVIEW-20260710-ChiaHub.md): room-key-sealed presence records.
# Pure-Rust AEAD — no linker-surface risk. Chain IO deps land in C1 after B-7.
chacha20poly1305 = "0.10"

# Chia chain IO — split in two since #231 D3 (2026-10-11):
#   `chia-read`    (in `default`) — hint lookups, parent-spend fetch, record decode:
#                  the presence reader and the P1 watcher. Reads cost no mojos and
#                  need no wallet, seed or account, so every node ships them.
#   `chia-publish` (opt-in at build time; runtime toggle SSF_CHIA_LANE=1) — the
#                  BLS wallet seed, spend-to-self publish and the craps fairness
#                  hook. Release builds carry it so one binary ships (D3: the
#                  separate `ssf-p2p-node-chia.exe` asset retires); dev builds
#                  may leave it out to skip the BLS12-381 + driver stack.
#   `chia-lane`    = alias for `chia-publish`, kept so older scripts still work.
#
# We depend on the specific chia-sdk SUB-CRATES, NOT the umbrella `chia-wallet-sdk`.
# The umbrella pulls chia-sdk-test (peer simulator), chia-sdk-daemon, chia-sdk-client,
# and the `rue` CLVM compiler as NON-optional deps; that extra symbol mass overflows
# the Windows-GNU DLL export-ordinal limit at link time (the same iroh-relay cdylib
# limit the iroh dep comment above already fights). Sub-crates only = far fewer
# exported symbols. Slice 2 (wallet key + address) needs just these four; the
# driver/types/signer crates joined as the publish/resolve slices landed.
#
# WINDOWS-GNU LINK NOTE: even the slim set tips the node's total DLL-export count
# over the 16-bit ordinal ceiling, because `iroh-relay` is force-built as an
# (unused) cdylib and MinGW ld auto-exports every symbol. Build the chia-lane
# feature with the flag that suppresses those unused cdylib exports:
#   RUSTFLAGS="-C link-arg=-Wl,--exclude-all-symbols" cargo build --features chia-lane
# The node is a bin (exports nothing) and nothing links iroh-relay's cdylib, so
# the flag is safe. Since `chia-read` joined `default` (D3) the flag may be
# needed for ANY Windows-GNU build; MSVC (what CI and releases use) never is.
chia-bls = { version = "0.36", optional = true, features = ["serde"] }
chia-protocol = { version = "0.36", optional = true, features = ["serde"] }
chia-puzzle-types = { version = "0.36", optional = true }
chia-sdk-utils = { version = "0.34", optional = true }
# Slice 4 (publish) + Slice 5 (resolve): spend construction and signing.
chia-sdk-driver = { version = "0.34", optional = true }
chia-sdk-types = { version = "0.34", optional = true }
chia-sdk-signer = { version = "0.34", optional = true }
# S-0 step 2 (#231 D1; plan §6/§14): the chain lane reaches Chia FULL-NODE PEERS
# over the light-wallet protocol — TLS websockets to port 58444 — instead of
# an HTTPS gateway (its client crate left with it; nothing here names a
# gateway host). The connection is the node's own (`chia_peer.rs`): the
# upstream `chia-sdk-client` hard-wires its TLS to either OpenSSL or rustls on
# `aws-lc-rs` (with bindgen), and §14's crate audit prefers the graph to stay
# on the one `ring` provider iroh already brings. So: rustls on ring, the
# websocket crate without any TLS feature (the TLS stream is opened here), and
# `chia-ssl` for the Chia-CA-signed client certificate every full node
# requires (minted per process, never written to disk). `chia-ssl` pulls `rsa`
# (0.10 release candidate; RSA is used for local key generation and
# certificate signing only, never to decrypt anything from the network).
chia-ssl = { version = "0.42", optional = true }
chia-traits = { version = "0.36", optional = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
# Allocator for the signer's RequiredSignature::from_coin_spends (already in the
# graph transitively; direct dep just makes clvmr::Allocator nameable).
clvmr = { version = "0.16", optional = true }
# Slice 5 (resolve): ToClvm/FromClvm traits to run the parent spend and decode the
# create_coin memos back out (already transitive; direct dep makes them nameable).
clvm-traits = { version = "0.36", optional = true }
clvm-utils = { version = "0.36", optional = true }
# Craps fairness (plan §12 / T1): SHA-256 for the commit-reveal + beacon dice
# derivation, byte-for-byte identical to the browser's src/games/fairDice.ts.
sha2 = { version = "0.10", optional = true }
# #231 P6a: the per-node presence record carries an X25519 key (`kx_pk`) that
# P6b's knocks are sealed to. Only the base-point multiplication is needed here;
# pinned to the exact version iroh-base already locks, so no second copy of the
# curve lands in the binary (Windows-GNU export-ordinal budget, see above).
curve25519-dalek = { version = "=5.0.0-rc.0", default-features = false, optional = true }

[dev-dependencies]
# The tests' mock full node builds a header block, whose BLS fields need the
# crate the publish feature makes optional.
chia-bls = { version = "0.36", features = ["serde"] }

[features]
default = ["chia-read"]
# Chain READS (#231 D3: on by default). Lookup-by-hint, parent-spend fetch and
# record decode for the presence reader + P1 watcher. No wallet, no seed, no spends.
chia-read = [
    "dep:chia-protocol", "dep:chia-puzzle-types", "dep:chia-sdk-types",
    "dep:chia-ssl", "dep:chia-traits", "dep:tokio-tungstenite", "dep:tokio-rustls",
    "dep:rustls", "dep:rustls-pemfile", "dep:futures-util",
    "dep:clvmr", "dep:clvm-traits", "dep:clvm-utils",
    "dep:curve25519-dalek",
]
# Chain WRITES: the BLS wallet seed + `txch1…` address, spend-to-self publish,
# the craps fairness hook and the treasury codec tests. Runtime-gated by
# SSF_CHIA_LANE=1 (the publish toggle; D4/P3 give it a UI later).
chia-publish = [
    "chia-read",
    "dep:chia-bls", "dep:chia-sdk-utils", "dep:chia-sdk-driver", "dep:chia-sdk-signer",
    "dep:sha2",
]
# Back-compat alias: `--features chia-lane` keeps meaning "the whole lane".
chia-lane = ["chia-publish"]
